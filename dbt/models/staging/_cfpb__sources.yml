sources:
  - name: cfpb
    description: CFPB Consumer Complaint Database, loaded as-is by extract_load/load_snowflake.py.
    database: CFPB
    schema: RAW
    tables:
      - name: complaints
        description: >
          One row per complaint_id, latest version from the bulk file or the daily API pull.
          All columns are VARCHAR exactly as published.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 2, period: day}
            error_after: {count: 7, period: day}
        columns:
          - name: complaint_id
            data_tests:
              - unique
              - not_null

      - name: load_log
        description: One row per file loaded into complaints, with inserted/updated counts.

models:
  - name: fct_complaints
    description: One row per complaint. The central table of the star schema.
    columns:
      - name: complaint_id
        data_tests:
          - unique
          - not_null
      - name: date_received
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: company_name
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_company')
                field: company_name
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: state_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_state')
                field: state_code
      - name: consumer_group
        data_tests:
          - accepted_values:
              arguments:
                values: ['Servicemember & older American', 'Servicemember', 'Older American', 'Other consumers']

  - name: dim_company
    description: One row per company with its complaint history.
    columns:
      - name: company_name
        data_tests:
          - unique
          - not_null

  - name: dim_product
    description: Product hierarchy - family, product, sub-product.
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null
      - name: product_family
        data_tests:
          - not_null

  - name: dim_state
    description: State codes with 2025 Census population.
    columns:
      - name: state_code
        data_tests:
          - unique
          - not_null

  - name: dim_date
    description: One row per calendar day since December 2011.
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null